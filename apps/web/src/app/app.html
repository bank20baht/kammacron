@if (items().length > 0) {
<!-- collapsible: the fold button by the brand, the choice kept per browser under storage-key -->
<baht-app-shell
  collapsible
  storage-key="kammacron.nav-hidden"
  scroll="main"
  brand="kammacron"
  brand-href="/board"
  label="kammacron"
  [items]="items()"
  [value]="current()"
  (baht-nav)="navigate($event)"
>
  <img
    data-slot="brand-art"
    src="/brand/app-mark.webp?v=glow-4"
    width="96"
    height="96"
    alt=""
    decoding="async"
  />
  <div data-slot="actions" class="actions">
    <app-status-bar></app-status-bar>
    <baht-theme-toggle default="system"></baht-theme-toggle>
  </div>
  <main class="shell-main">
    <router-outlet />
  </main>
</baht-app-shell>
} @else {
<!-- before the session (the token page): no frame, nothing to navigate to yet -->
<main class="bare">
  <router-outlet />
</main>
}
<baht-toast></baht-toast>
