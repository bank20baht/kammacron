@if (items().length > 0) {
<baht-app-shell
  [class.nav-hidden]="navHidden()"
  scroll="main"
  brand="kammacron"
  brand-href="/board"
  label="kammacron"
  [items]="items()"
  [value]="current()"
  (baht-nav)="navigate($event)"
>
  <img
    data-slot="brand-art"
    src="/brand/app-mark.webp?v=transparent-2"
    width="256"
    height="256"
    alt=""
    decoding="async"
  />
  <!-- by the brand, on the left: fold the navigator away for a wider page -->
  <div data-slot="breadcrumb" class="nav-toggle">
    <baht-button
      variant="ghost"
      size="sm"
      [icon]="navHidden() ? 'chevron-right' : 'chevron-left'"
      icon-only
      [label]="navHidden() ? t('nav.show') : t('nav.hide')"
      [attr.aria-pressed]="navHidden()"
      (click)="toggleNav()"
    ></baht-button>
  </div>
  <div data-slot="actions" class="actions">
    <app-status-bar></app-status-bar>
    <baht-theme-toggle default="system"></baht-theme-toggle>
  </div>
  <main class="shell-main">
    <router-outlet />
  </main>
</baht-app-shell>
} @else {
<!-- before the session (the token page): no frame, nothing to navigate to yet -->
<main class="bare">
  <router-outlet />
</main>
}
<baht-toast></baht-toast>
